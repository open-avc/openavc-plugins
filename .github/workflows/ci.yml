name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate plugin packages and index.json
        run: python validate.py --check-index

      # OpenAVC checks every file it downloads against manifest.json and
      # refuses anything that doesn't match, so a stale manifest breaks
      # installs of the plugin that changed. Regenerate and commit it in the
      # same pull request as the files it covers.
      - name: manifest.json matches the committed plugin files
        run: python scripts/build_manifest.py --check
